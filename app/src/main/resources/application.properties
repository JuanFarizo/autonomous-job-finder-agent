spring.main.web-application-type=none
spring.main.banner-mode=off
# Ollama Cloud (D14, D15). The API key is read from the OLLAMA_API_KEY environment variable in OllamaConfig.
spring.ai.ollama.base-url=https://ollama.com
# Model is chosen by the owner (D16 pending): export OLLAMA_MODEL, e.g. a free-tier model from ollama.com/search?c=cloud
spring.ai.ollama.chat.model=${OLLAMA_MODEL:}
spring.ai.ollama.init.pull-model-strategy=never
