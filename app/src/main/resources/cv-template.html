<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  /* Type scale (pt): name 21 / headline 11 / section 9 caps / role 10 / body 9.5 / dates 9 / contact 8.5
     Rhythm: 4pt unit. Section gap 12pt, heading to content 6pt, job gap 8pt.
     Colours: ink #1d1f20, secondary #4a4f54, accent #2c455d (name, headings), rule #6d8aa6. */
  @page { size: A4; margin: 16mm 17mm 15mm 17mm; }
  body { margin: 0; padding: 0; font-family: Helvetica, Arial, sans-serif; font-size: 9.5pt; line-height: 1.4; color: #1d1f20; }
  p { margin: 0; }
  h1 { margin: 0; font-size: 21pt; line-height: 1.1; font-weight: bold; letter-spacing: 0.4pt; color: #2c455d; }
  .headline { margin: 3pt 0 0 0; font-size: 11pt; line-height: 1.3; color: #1d1f20; }
  .contact { margin: 4pt 0 0 0; font-size: 8.5pt; line-height: 1.35; color: #4a4f54; }
  h2 { margin: 16pt 0 6pt 0; padding: 0 0 2pt 0; font-size: 9pt; line-height: 1.2; font-weight: bold; text-transform: uppercase; letter-spacing: 1.2pt; color: #2c455d; border-bottom: 0.6pt solid #6d8aa6; page-break-after: avoid; }
  ul { margin: 0; padding: 0 0 0 11pt; }
  li { margin: 0 0 1.5pt 0; padding: 0 0 0 1pt; }
  .skills { font-size: 9pt; line-height: 1.5; }
  .job { margin: 0 0 8pt 0; page-break-inside: avoid; }
  .jobhead { width: 100%; border-collapse: collapse; margin: 0; }
  .jobhead td { padding: 0; vertical-align: bottom; }
  .role { font-size: 10pt; font-weight: bold; color: #1d1f20; }
  .dates { width: 32%; text-align: right; font-size: 9pt; color: #4a4f54; white-space: nowrap; }
  .company { margin: 0 0 3pt 0; font-size: 9.5pt; font-style: italic; color: #1d1f20; }
</style>
</head>
<body>
  <h1>{{name}}</h1>
  <p class="headline">{{headline}}</p>
  <p class="contact">{{contact}}</p>
  <h2>Summary</h2>
  <p>{{summary}}</p>
  {{highlights}}
  <h2>Skills</h2>
  <p class="skills">{{skills}}</p>
  <h2>Experience</h2>
  {{experience}}
  {{education}}
  {{languages}}
</body>
</html>
