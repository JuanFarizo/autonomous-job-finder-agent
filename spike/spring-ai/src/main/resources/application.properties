spring.main.web-application-type=none
spring.main.banner-mode=off

# Anthropic (official anthropic-java SDK under the hood)
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:missing}
spring.ai.anthropic.chat.model=claude-sonnet-5-5
spring.ai.anthropic.chat.max-tokens=300

# Ollama Cloud: direct API at https://ollama.com ; auth header is added in SpikeConfig from OLLAMA_API_KEY
# (spring.ai.ollama.* has no api-key property in 2.0.1)
spring.ai.ollama.base-url=https://ollama.com
spring.ai.ollama.chat.model=${OLLAMA_MODEL:gpt-oss:120b}
spring.ai.ollama.chat.options.num-predict=300
spring.ai.ollama.init.pull-model-strategy=never
